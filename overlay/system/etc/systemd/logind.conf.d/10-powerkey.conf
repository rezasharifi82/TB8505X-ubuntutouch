# Power key policy for TB-8505X (Ubuntu Touch 24.04)
#
# The physical power key must be handled exclusively by repowerd.  If logind
# also acts on it, both daemons race on the display state and the kernel can
# end up with the panel suspended while userspace believes it is on - the
# exact symptom of the black-screen-on-wake bug.

[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
